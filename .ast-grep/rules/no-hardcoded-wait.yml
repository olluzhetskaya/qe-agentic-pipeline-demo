id: no-hardcoded-wait
language: typescript
message: >
  Hardcoded page.waitForTimeout() found in a test file. Use an explicit
  Playwright wait (expect(...).toBeVisible(), page.waitForURL(), etc.)
  instead — see .agents/skills/assertion-author. Kept here as a second,
  independent check alongside eslint-plugin-playwright's
  no-wait-for-timeout rule, not a replacement for it.
severity: error
rule:
  pattern: page.waitForTimeout($ARG)
