# SonarQube / SonarCloud — CI-level quality gate
#
# This file configures the live SonarQube/SonarCloud server scan that runs
# in CI. It is distinct from the local eslint-plugin-sonarjs pass that the
# afterFileEdit hook runs on every agent write — the two are complementary:
#
#   Local (hook):  eslint-plugin-sonarjs — same 279 rules, instant feedback,
#                  no server required. Runs inside Cursor on every src/tests/
#                  file the agent touches.
#
#   CI (this):     SonarQube/SonarCloud server — adds cross-run tracking,
#                  quality-gate history, coverage trends, and issue assignment
#                  that a local ESLint plugin cannot provide on its own.
#
# See ADR-014 (docs/adr/ADR-014-multi-agent-test-generation-pipeline.md)
# §Validation gates for the full rationale.
#
# To connect to SonarCloud:
#   1. Set SONAR_TOKEN in your CI environment (GitHub Actions secret, etc.)
#   2. Replace sonar.organization with your SonarCloud organization key.
#   3. sonar.projectKey must be unique within that organization.
#
# To connect to a self-hosted SonarQube:
#   1. Set SONAR_TOKEN and SONAR_HOST_URL in CI.
#   2. Remove sonar.organization (it's SonarCloud-only).

sonar.projectKey=qe-agentic-pipeline-demo
sonar.projectName=QE Agentic Pipeline Demo
sonar.projectVersion=1.0

# Replace with your SonarCloud organization slug (remove for self-hosted SonarQube)
sonar.organization=your-org-slug

# Source to analyse — src/ only; golden_dataset/ is calibration fixtures,
# not shipped code, so exclude it from the server scan just as the lint
# script excludes golden_dataset/dirty/ from the default sweep.
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/playwright-report/**,**/test-results/**

# Test files — SonarQube separates test coverage from main-source coverage
sonar.tests=src/tests
sonar.test.inclusions=**/*.spec.ts

# TypeScript — point Sonar at the tsconfig so it resolves path aliases
sonar.typescript.tsconfigPath=tsconfig.json

# Coverage report (generate with: npx playwright test --reporter=junit,html)
# Uncomment once coverage output is wired up in CI:
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
