# Real setup: wire this to a SonarQube/SonarCloud server in CI and run
# `sonar-scanner` in .cursor/hooks/after-file-edit.js instead of the local
# heuristic stand-in. Kept as config-only here so the demo has no external
# dependency, but the shape matches what CI would actually use.
sonar.projectKey=qe-agentic-pipeline-demo
sonar.sources=src
sonar.tests=src/tests,golden_dataset
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=node_modules/**,playwright-report/**,test-results/**
sonar.typescript.tsconfigPath=tsconfig.json
sonar.sourceEncoding=UTF-8
